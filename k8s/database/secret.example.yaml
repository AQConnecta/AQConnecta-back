# Crie o Secret real fora do git. Exemplo:
#
#   kubectl -n aqconnecta create secret generic mariadb-secret \
#       --from-literal=root-password='SENHA_ROOT_FORTE' \
#       --from-literal=user-password='SENHA_APP_FORTE'
#
# Este arquivo é apenas referência da estrutura esperada.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: aqconnecta
type: Opaque
stringData:
  root-password: REPLACE_ME
  user-password: REPLACE_ME
