apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqconnecta

resources:
  - namespace.yaml

  # Banco
  - database/configmap.yaml
  - database/pvc.yaml
  - database/service.yaml
  - database/statefulset.yaml

  # Backend
  - backend/configmap.yaml
  - backend/pvc.yaml
  - backend/service.yaml
  - backend/deployment.yaml
  - backend/ingress.yaml

  # Frontend (infra apenas — o Deployment do front fica no repo do AQConnecta-front/k8s/)
  - frontend/configmap.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml

# Secrets reais NÃO entram aqui. Aplique manualmente fora do git:
#   kubectl apply -f database/secret.example.yaml      (use só como referência)
#   kubectl apply -f backend/secret.example.yaml       (use só como referência)
