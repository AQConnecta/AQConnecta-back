spring.application.name=aqConnecta
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=none
# impede o jpa de alterar o nome das tabelas e campos pra caixa baixa
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.hibernate.SQL=debug
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-on-migrate=true
url=localhost
port=8080
# --- JWT ---
jwt.secret=${JWT_SECRET:StringUsadaParaGerarToken}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# ---- AWS ----
aws.accessKey="test-access-key"
aws.secretAccessKey="test-secret-access-key"
aws.bucketName="test-bucket"