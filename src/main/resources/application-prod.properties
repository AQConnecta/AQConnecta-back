spring.application.name=aqConnecta
# --- Banco ---
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:aqConnecta}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# --- Logging ---
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.aqConnecta=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}
# --- Flyway ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
# --- Server / App ---
server.port=${PORT:8080}
url=${APP_URL:localhost}
# --- E-mail ---
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
spring.mail.from-name=${MAIL_FROM_NAME:AQConnecta}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:5000}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2}
# Para STARTTLS (port 587): basta as props acima.
# Para SMTPS direto (port 465 do Gmail): rode o JVM com
#   -Dspring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
#   -Dspring.mail.properties.mail.smtp.socketFactory.port=465
# ---- Armazenamento de arquivos (PVC local) ----
file.storage.path=${FILE_STORAGE_PATH:/var/data/uploads}
# Prefixo público das URLs retornadas para o frontend.
# Vazio = retorna caminho relativo (/files/{nome}) — o frontend usa same-origin via proxy.
# Defina para forçar URL absoluta (ex: https://aqconnecta-back.riume.com.br).
file.public.base-url=${FILE_PUBLIC_BASE_URL:}

# Multipart (uploads HTTP)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}
# ---- Denúncias de projeto ----
projeto.denuncia.limiar=${DENUNCIA_LIMIAR:5}
# --- CORS ---
cors.urls=${CORS_URLS:http://localhost:3000}
# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# --- Actuator ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
# Envio de e-mail é @Async/best-effort: SMTP indisponível não deve derrubar o readiness.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# --- Métricas (Prometheus/Micrometer) ---
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=aqconnecta
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,300ms,500ms,1s,2s

# --- Tracing (Micrometer Tracing -> OTLP -> Grafana Tempo) ---
# Amostragem: 1.0 = 100% dos requests viram trace (ideal para investigar erros).
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://tempo.monitoring.svc.cluster.local:4318/v1/traces}
# traceId/spanId injetados nos logs para correlação log <-> trace.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
